name: Release

# Publishes to the Visual Studio Marketplace and Open VSX when a tag like v0.2.0 is pushed.
# Tags with a suffix (v0.2.0-beta.1) are published as pre-releases.
#
# Marketplace auth uses Microsoft Entra ID through GitHub OIDC (global Azure DevOps PATs are
# retired on 2026-12-01). One-time setup is described in RELEASING.md:
#   secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and OVSX_PAT.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC login to Azure

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Check that the tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          [ "${tag%%-*}" = "$v" ] || { echo "Tag $GITHUB_REF_NAME does not match version $v"; exit 1; }

      - name: Package
        run: |
          flag=""; case "$GITHUB_REF_NAME" in *-*) flag="--pre-release";; esac
          echo "PRE=$flag" >> "$GITHUB_ENV"
          npx vsce package $flag --out explorer-for-penpot.vsix

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish $PRE --azure-credential --packagePath explorer-for-penpot.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish $PRE --packagePath explorer-for-penpot.vsix

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""; [ -n "$PRE" ] && flag="--prerelease"
          gh release create "$GITHUB_REF_NAME" explorer-for-penpot.vsix --title "$GITHUB_REF_NAME" --generate-notes $flag
