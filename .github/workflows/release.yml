name: Release

# Publishes to the Visual Studio Marketplace and Open VSX when a tag like v0.2.0 is pushed.
# Tags with a suffix (v0.2.0-beta.1) are published as pre-releases.
#
# Marketplace auth uses Trusted Publishing (GitHub OIDC, no stored token): the publisher has a
# policy for this repository and workflow. Open VSX still needs the OVSX_PAT secret.
# One-time setup is described in RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # Marketplace Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

      - name: Check that the tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          [ "${tag%%-*}" = "$v" ] || { echo "Tag $GITHUB_REF_NAME does not match version $v"; exit 1; }

      - name: Package
        run: |
          flag=""; case "$GITHUB_REF_NAME" in *-*) flag="--pre-release";; esac
          echo "PRE=$flag" >> "$GITHUB_ENV"
          npx vsce package $flag --out explorer-for-penpot.vsix

      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish $PRE --oidc --packagePath explorer-for-penpot.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          # Creates the namespace on the first release; afterwards it already exists and this is a no-op.
          ns="$(node -p "require('./package.json').publisher")"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/$ns")" = "404" ]; then
            npx ovsx create-namespace "$ns"
          fi
          npx ovsx publish $PRE --packagePath explorer-for-penpot.vsix

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""; [ -n "$PRE" ] && flag="--prerelease"
          gh release create "$GITHUB_REF_NAME" explorer-for-penpot.vsix --title "$GITHUB_REF_NAME" --generate-notes $flag
