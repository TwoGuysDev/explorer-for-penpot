name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run bundle
      - run: npx vsce package --out explorer-for-penpot.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: explorer-for-penpot.vsix
